name: PR Merge Gate

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - labeled
      - unlabeled
      - ready_for_review

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit Tests
    if: contains(github.event.pull_request.labels.*.name, 'ready-to-merge')
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        env:
          TYPER_USE_RICH: "0"
        run: python -B -m unittest discover -s tests -v

  merge-gate:
    name: Merge Gate
    needs: unit-tests
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Require label and passing tests
        shell: bash
        run: |
          if [[ "${{ contains(github.event.pull_request.labels.*.name, 'ready-to-merge') }}" != "true" ]]; then
            echo "PR is missing the 'ready-to-merge' label."
            exit 1
          fi

          if [[ "${{ needs.unit-tests.result }}" != "success" ]]; then
            echo "Unit tests must pass before merge."
            exit 1
          fi

          echo "Merge gate passed."
